<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 12" preserveAspectRatio="none" role="img" aria-label="PolyCreator brand band">
  <!-- The logo's hue sweep, at the stops recorded in tokens/gradients.json →
       brand.band (#00d9ef 0 · #438fff .28 · #7b2cff .55 · #ed00d9 .8 · #ff8a21 1).
       An accent rule, not a surface: never set type on it. -->
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d9ef"/>
      <stop offset="0.28" stop-color="#438fff"/>
      <stop offset="0.55" stop-color="#7b2cff"/>
      <stop offset="0.8" stop-color="#ed00d9"/>
      <stop offset="1" stop-color="#ff8a21"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="12" fill="url(#band)"/>
</svg>
